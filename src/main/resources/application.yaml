# Cấu hình Spring Boot: Kết nối Supabase PostgreSQL, đồng bộ migration qua Flyway và kiểm soát thực thể bằng JPA.
spring:
  application:
    name: bfms-backend

  # 1. Cấu hình kết nối tới Supabase (PostgreSQL)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 2. Cấu hình Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

  # 3. Cấu hình Spring Data JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # 4. Cấu hình SpringDoc OpenAPI
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: alpha
      tags-sorter: alpha
    api-docs:
      path: /v3/api-docs
    show-actuator: true
  
  # 5. Cấu hình upload file
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

application:
  file:
    upload-dir: uploads/contracts
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION}
    permit-all-patterns:
      - "/api/v1/auth/**"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
      - "/swagger-ui.html"
    cors:
      allowed-origins:
        - "http://localhost:4200"
      allowed-methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "PATCH"
        - "OPTIONS"
      allowed-headers:
        - "*"
      allow-credentials: true